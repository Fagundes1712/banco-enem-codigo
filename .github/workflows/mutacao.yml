name: Mutação

# Teste de mutação (Stryker) sob demanda: Actions > Mutação > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mutacao
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutacao
          path: reports/mutation/
          retention-days: 14
