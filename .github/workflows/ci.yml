name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commitlint lê os commits do PR
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # sintaxe, limite de linhas, espelho, contratos de arquitetura, Biome, Knip,
      # testes unitários e testes jsdom com o banco real
      - run: npm run verify
      - name: Mensagens de commit
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Cobertura no Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sobe o servidor da Fase 1 em modo produção e confere o que fica exposto.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formato do cloud-init
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-init
          cloud-init schema --config-file infra/cloud-init.yaml
      - name: Sobe a pilha
        working-directory: infra
        run: |
          sed -e 's/^\(SENHA_[A-Z]*\|TURNSTILE_SECRET\|RESEND_API_KEY\|ABACATEPAY_API_KEY\)=$/\1=teste-ci-1234567890/' \
              -e 's/^JWT_SECRET=$/JWT_SECRET=teste-ci-12345678901234567890123456789012/' \
              -e 's/^ABACATEPAY_WEBHOOK_SECRET=$/ABACATEPAY_WEBHOOK_SECRET=teste-ci-1234567890/' \
              -e 's/^ORIGEM_SECRET=$/ORIGEM_SECRET=origem-ci/' \
              -e 's/^ALERTA_EMAIL=$/ALERTA_EMAIL=ci@exemplo.com/' .env.example > .env
          docker compose up -d --build
      - name: API responde só com o segredo da Cloudflare
        run: |
          curl -fsS --retry 20 --retry-connrefused --retry-all-errors --retry-delay 2 -H "X-Origem: origem-ci" http://127.0.0.1:8080/saude
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/saude)" = 403
      - name: Banco e Redis sem porta, API só em localhost, sem senha de migração
        working-directory: infra
        run: |
          docker compose ps --format '{{.Service}} {{.Publishers}}'
          test "$(docker compose port api 8080)" = "127.0.0.1:8080"
          test -z "$(docker compose ps postgres redis --format '{{range .Publishers}}{{.PublishedPort}}{{end}}' | tr -d '0\n')"
          if docker compose exec -T api env | grep -E 'MIGRACAO|SENHA_POSTGRES|PGPASSWORD'; then exit 1; fi
          docker compose exec -T postgres psql -U postgres -d bancoenem -Atc "SELECT count(*) FROM pg_policies" | grep -qv '^0$'
      - name: Subir de novo não quebra
        working-directory: infra
        run: |
          docker compose up -d
          curl -fsS --retry 20 --retry-connrefused --retry-all-errors --retry-delay 2 -H "X-Origem: origem-ci" http://127.0.0.1:8080/saude
      - name: Alerta dispara com evento grave
        working-directory: infra
        run: |
          curl -s -o /dev/null -X POST -H "X-Origem: origem-ci" -d '{}' 'http://127.0.0.1:8080/webhooks/abacatepay?webhookSecret=errado'
          sleep 2
          bash alerta.sh 2>&1 | tee alerta.txt
          grep -q webhook_recusado alerta.txt
      - name: Backup criptografado e restauração de ponta a ponta
        working-directory: infra
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          age-keygen -o "$RUNNER_TEMP/chave.txt"
          echo "BACKUP_CHAVE_PUBLICA=$(age-keygen -y "$RUNNER_TEMP/chave.txt")" >> .env
          echo "BACKUP_DESTINO=$RUNNER_TEMP/backups" >> .env
          bash backup.sh
          arquivo=$(ls "$RUNNER_TEMP"/backups/*.dump.age)
          # O dump não pode ser legível sem a chave.
          if grep -qa 'senha_hash' "$arquivo"; then exit 1; fi
          bash testa-restauracao.sh "$arquivo" "$RUNNER_TEMP/chave.txt"
      - name: Scripts sem erro comum
        run: shellcheck -x -S warning infra/*.sh
      - name: Registros se falhar
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color --tail=60

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Testes da API como api_app num PostgreSQL migrado, com RLS, igual à produção (o local usa SQLite).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: bancoenem
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TESTE_DATABASE_URL: postgresql+psycopg://api_app:senha-app@localhost:5432/bancoenem
      TESTE_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:teste@localhost:5432/bancoenem
      MIGRACAO_DATABASE_URL: postgresql+psycopg://api_migracao:senha-migracao@localhost:5432/bancoenem
      TESTE_PAINEL_DATABASE_URL: postgresql+psycopg://painel_leitura:senha-painel@localhost:5432/bancoenem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Papéis do banco
        env:
          PGPASSWORD: teste
        run: psql -h localhost -U postgres -d bancoenem -v ON_ERROR_STOP=1 -v senha_app=senha-app -v senha_migracao=senha-migracao -v senha_painel=senha-painel -f migracoes/papeis.sql
      - name: Migrações sobem, descem, sobem e batem com os modelos
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check
      - run: python -m pytest
      # Camadas extras: vulnerabilidade conhecida nas dependências e padrões perigosos no código.
      - run: pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements.txt --strict
      - run: bandit -r app -ll
