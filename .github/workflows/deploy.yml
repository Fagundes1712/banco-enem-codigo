name: Deploy

# Publica site/public no repositório Fagundes1712/banco-enem-app (GitHub Pages).
# Automático depois do CI verde na main só quando a variável DEPLOY_AUTOMATICO = true.
# Manual (e rollback): Actions > Deploy > Run workflow, com o commit desejado em "ref".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag ou branch a publicar (rollback = um commit anterior da main)
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_AUTOMATICO == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: producao
      url: https://fagundes1712.github.io/banco-enem-app/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Clonar o repositório do site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Fagundes1712/banco-enem-app
          ssh-key: ${{ secrets.DEPLOY_KEY_SITE }}
          path: _site

      - name: Publicar
        run: |
          find _site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r site/public/. _site/
          touch _site/.nojekyll
          cd _site
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou no site."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Deploy de ${GITHUB_REPOSITORY}@$(git -C .. rev-parse --short HEAD)"
          git push origin HEAD:main

      - name: Conferir o site no ar
        run: npm run pos-deploy

      # Cópia com cabeçalhos de segurança (_headers), só quando a variável CLOUDFLARE_PAGES_PROJETO existir.
      # Versão exata do wrangler; a criação do projeto só vale na primeira vez (depois já existe).
      - name: Publicar no Cloudflare Pages
        if: vars.CLOUDFLARE_PAGES_PROJETO != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJETO: ${{ vars.CLOUDFLARE_PAGES_PROJETO }}
        run: |
          npx --yes wrangler@4.155.0 pages project list | grep -qw "$PROJETO" ||
            npx --yes wrangler@4.155.0 pages project create "$PROJETO" --production-branch=main
          npx --yes wrangler@4.155.0 pages deploy site/public --project-name="$PROJETO" --branch=main

      - name: Conferir o Cloudflare Pages
        if: vars.CLOUDFLARE_PAGES_PROJETO != ''
        env:
          SITE_URL: https://${{ vars.CLOUDFLARE_PAGES_PROJETO }}.pages.dev/
        run: |
          npm run pos-deploy
          curl -sfI "$SITE_URL" | grep -i "^content-security-policy:.*frame-ancestors 'none'"
